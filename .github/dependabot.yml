version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # typescript-eslint refuses to load under TypeScript 7 (checked 4 Nov 2026).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
