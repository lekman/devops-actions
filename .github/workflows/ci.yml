name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      # Actions run the committed dist/ files, so a source change without a
      # rebuild would ship the old behaviour.
      - name: dist matches the source
        run: |
          bun run build
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::dist/ differs from a fresh build. Run 'bun run build' and commit the result."
            exit 1
          fi

  actions:
    name: Lint Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: actionlint
        run: actionlint

  # Runs the security action from this checkout, so a change to it is
  # exercised before anyone pins the new SHA.
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/security
        with:
          semgrep-json-output: ${{ runner.temp }}/semgrep-results.json
          gitleaks-json-output: ${{ runner.temp }}/gitleaks-results.json
