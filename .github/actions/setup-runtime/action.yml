# Installs the language toolchain a repository declares for itself, using mise.
#
# Versions come from the consumer repo, never from this action. That is the
# point: a toolkit that pins the toolchain hands every consumer the toolkit's
# versions instead of their own, and the drift is invisible until something
# breaks in CI that worked locally.
#
# Prerequisites:
#   - The repository must already be checked out (actions/checkout).
#   - The repo must declare a toolchain in one of:
#       mise.toml / .mise.toml / mise/config.toml   explicit, any tool
#       .tool-versions                              asdf-compatible
#       .node-version, .python-version,             idiomatic; a settings-only
#         package.json packageManager                 config is generated so
#         mise reads the files the repo already has
#     Declaring none of these fails this step, rather than installing nothing
#     and failing later somewhere less obvious.
#
# A Python repo that pins no interpreter is treated the same way. Passing
# `python-version` covers the case where the only pin lives in pyproject's
# `requires-python`, which mise does not read as an idiomatic file — the
# caller extracts it (see the detect-language action) and hands it over.

name: Setup Runtime
description: >-
  Install the toolchain the repository pins for itself, via mise, with caching.
  Requires a prior checkout. Fails when the repo declares no toolchain.

inputs:
  working-directory:
    description: Directory holding the toolchain declaration, repository-relative.
    required: false
    default: "."
  cache:
    description: >-
      Read and write the mise tool cache. Set "false" to bypass it. Bypassed
      automatically when the runner already has the pinned Python installed
      through mise, as the Northbridge runner image does.
    required: false
    default: "true"
  install-args:
    description: >-
      Limit what is installed, e.g. "bun" or "node bun". Empty installs
      everything the declaration names.
    required: false
    default: ""
  mise-version:
    description: Pin mise itself. Empty uses the latest release.
    required: false
    default: ""
  python-version:
    description: >-
      Interpreter version to pin when the repo has no .python-version, for
      example the value read out of pyproject's requires-python. Ignored when
      an explicit mise config or a .python-version file is present, both of
      which the repository owns. Empty pins nothing.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether the mise tool cache was restored.
    value: ${{ steps.mise.outputs.cache-hit }}
  config-source:
    description: >-
      The declaration that was used — a repository-relative path, or
      "idiomatic" when generated from .node-version, .python-version, or
      package.json packageManager.
    value: ${{ steps.detect.outputs.source }}
  tools:
    description: Newline-separated tool/version pairs that mise resolved.
    value: ${{ steps.resolved.outputs.tools }}

runs:
  using: composite
  steps:
    # Composite `shell: bash` runs with -eo pipefail, so every test that may
    # legitimately fail is written as an if-block. `[ -f x ] && y` would abort
    # the whole step the first time the file is absent.
    - name: Detect the toolchain declaration
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        for f in mise.toml .mise.toml mise/config.toml .tool-versions; do
          if [ -f "$f" ]; then
            echo "source=$f" >> "$GITHUB_OUTPUT"
            printf 'generated=\n' >> "$GITHUB_OUTPUT"
            echo "::notice title=Setup Runtime::toolchain declared by $f"
            exit 0
          fi
        done

        # No explicit config. mise ignores .node-version, .python-version and
        # packageManager unless the idiomatic version files are enabled, so
        # generate a config that turns them on. The versions still come from
        # the repository's own files; the one thing this config can pin is a
        # Python version the caller read out of pyproject, which mise has no
        # way to read for itself.
        found=""
        idiomatic='"node", "bun"'
        pinned=""

        if [ -f .node-version ]; then
          found="$found .node-version"
        fi
        if [ -f package.json ] && grep -q '"packageManager"' package.json; then
          found="$found package.json:packageManager"
        fi
        if [ -f .python-version ]; then
          found="$found .python-version"
          idiomatic="$idiomatic, \"python\""
        elif [ -n "$PYTHON_VERSION" ]; then
          # No .python-version to read, so pin what the caller resolved.
          # This is still the repository's own version — it came out of
          # pyproject's requires-python, which mise does not read itself.
          found="$found python@$PYTHON_VERSION"
          pinned="python = \"$PYTHON_VERSION\""
        fi

        if [ -z "$found" ]; then
          echo "::error title=Setup Runtime::no toolchain declared in '$WORKING_DIRECTORY'. Add mise.toml, .tool-versions, .node-version, .python-version, or package.json packageManager."
          exit 1
        fi

        echo "source=idiomatic" >> "$GITHUB_OUTPUT"
        {
          echo 'generated<<MISE_TOML_EOF'
          echo '[settings]'
          echo "idiomatic_version_file_enable_tools = [$idiomatic]"
          if [ -n "$pinned" ]; then
            echo '[tools]'
            echo "$pinned"
          fi
          echo 'MISE_TOML_EOF'
        } >> "$GITHUB_OUTPUT"
        echo "::notice title=Setup Runtime::toolchain declared by$found (idiomatic version files)"

    # A runner image can carry mise and the interpreter already, at mise's own
    # data dir. When the pinned Python is there, the cache restore is pure
    # cost: on the self-hosted ARM64 runner it was 97 s waiting for the cache
    # service plus 17 s restoring 262 MB, to then report "already installed".
    # GitHub-hosted runners carry nothing, so they keep the cache.
    - name: Check for a preinstalled toolchain
      id: preinstalled
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        CACHE: ${{ inputs.cache }}
      run: |
        set -uo pipefail
        wanted=""
        if [ -f .python-version ]; then
          wanted="$(head -n1 .python-version | tr -d '[:space:]')"
        elif [ -n "$PYTHON_VERSION" ]; then
          wanted="$PYTHON_VERSION"
        fi
        cache="$CACHE"
        if [ -n "$wanted" ] && command -v mise >/dev/null 2>&1 \
          && mise where "python@$wanted" >/dev/null 2>&1; then
          cache=false
          echo "::notice title=Setup Runtime::python@$wanted is preinstalled on the runner, mise cache skipped"
        fi
        echo "cache=$cache" >> "$GITHUB_OUTPUT"

    - name: Install the toolchain
      id: mise
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: ${{ inputs.mise-version }}
        working_directory: ${{ inputs.working-directory }}
        mise_toml: ${{ steps.detect.outputs.generated }}
        install_args: ${{ inputs.install-args }}
        cache: ${{ steps.preinstalled.outputs.cache }}

    # Records what was actually installed. A toolchain step that says nothing
    # is the reason version drift goes unnoticed for weeks.
    - name: Report the resolved toolchain
      id: resolved
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail

        tools=""
        if command -v mise >/dev/null 2>&1; then
          tools=$(mise ls --current 2>/dev/null) || tools=""
        fi

        if [ -z "$tools" ]; then
          echo "::warning title=Setup Runtime::mise resolved no tools from '${{ steps.detect.outputs.source }}'"
        else
          echo "$tools"
          {
            echo "### Setup Runtime"
            echo ""
            echo "Declared by \`${{ steps.detect.outputs.source }}\`"
            echo ""
            echo '```'
            echo "$tools"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        {
          echo 'tools<<TOOLS_EOF'
          echo "$tools"
          echo 'TOOLS_EOF'
        } >> "$GITHUB_OUTPUT"
