# Parses JUnit XML plus a coverage report emitted by a test run and writes
# a compact markdown summary to `out-path`.
#
# The JUnit and coverage inputs each take one path or several, separated
# by newlines or commas, and a directory stands for every report below it.
# Gradle and Maven write one JUnit file per test class and one coverage
# report per module, and their totals are added up. The caller uploads the result as a
# workflow artifact named `findings-<job>` for consumption by quality-gate.
#
# Logic lives in packages/devops-actions/src/findings-tests.ts and is
# compiled into dist/ by the package build step.
#
# Inputs are optional — missing files are skipped, partial results are
# still emitted. When neither input yields parseable content the action
# writes nothing and exits 0.

name: Findings — Tests
description: >-
  Parse JUnit XML plus LCOV, Cobertura or JaCoCo coverage into a compact
  markdown summary for embedding inside the quality-gate PR comment.

inputs:
  junit-path:
    description: >-
      JUnit XML from bun test, jest, vitest, pytest, Gradle, Maven Surefire
      or dotnet-quality. One or more files or directories, separated by
      newlines or commas. A directory is searched for *.xml.
    required: false
    default: junit.xml
  lcov-path:
    description: Path to LCOV info file (e.g. coverage/lcov.info).
    required: false
    default: coverage/lcov.info
  coverage-xml-path:
    description: >-
      Cobertura XML coverage, as pytest-cov, coverage.py, coverlet and
      Microsoft code coverage write it. One or more files or directories.
      Read only when no LCOV file is present, so a repo emitting both keeps
      the LCOV numbers it has always reported. Several reports are merged
      line by line.
    required: false
    default: coverage.xml
  jacoco-path:
    description: >-
      JaCoCo XML coverage, as JaCoCo and Kover write it (jvm-quality's
      coverage-paths output). One or more files or directories. Read only
      when neither LCOV nor Cobertura is present. Several reports, one per
      module, are added up.
    required: false
    default: ""
  lint-log:
    description: Path to captured lint step output (ESLint stylish, Biome, or generic format).
    required: false
    default: ""
  typecheck-log:
    description: Path to captured typecheck step output (tsc format).
    required: false
    default: ""
  out-path:
    description: Absolute path to write the findings markdown to.
    required: true

runs:
  using: composite
  steps:
    - name: Generate quality findings
      shell: bash
      env:
        LINT_LOG: ${{ inputs.lint-log }}
        TYPECHECK_LOG: ${{ inputs.typecheck-log }}
        JUNIT_PATH: ${{ inputs.junit-path }}
        LCOV_PATH: ${{ inputs.lcov-path }}
        COVERAGE_XML_PATH: ${{ inputs.coverage-xml-path }}
        JACOCO_PATH: ${{ inputs.jacoco-path }}
        OUT_PATH: ${{ inputs.out-path }}
      run: |
        ARGS=(--junit "$JUNIT_PATH" --lcov "$LCOV_PATH" --coverage-xml "$COVERAGE_XML_PATH" --out "$OUT_PATH")
        [ -n "$JACOCO_PATH" ] && ARGS+=(--jacoco-xml "$JACOCO_PATH")
        [ -n "$LINT_LOG" ] && ARGS+=(--lint-log "$LINT_LOG")
        [ -n "$TYPECHECK_LOG" ] && ARGS+=(--typecheck-log "$TYPECHECK_LOG")
        node "${{ github.action_path }}/dist/findings-tests.js" "${ARGS[@]}"
