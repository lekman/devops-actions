# Runs Semgrep SAST against the checked-out repository with the semgrep CLI.
# GitHub-hosted runners do not carry it, so the action installs a pinned
# version with pipx when it is missing. We call semgrep directly instead of
# returntocorp/semgrep-action because that action has no linux/arm64
# container manifest.
#
# Prerequisites:
#   - The repository must already be checked out (actions/checkout).
#   - pipx on PATH when semgrep is not (ubuntu-latest has pipx).

name: Security Scan
description: >-
  Run Semgrep SAST. Configurable rulesets via input.
  Installs semgrep when the runner lacks it. Requires a prior checkout step.

inputs:
  rulesets:
    description: >-
      Space-separated Semgrep rulesets. Default covers OWASP Top 10,
      secrets detection, and TypeScript-specific rules.
    required: false
    default: "p/security-audit p/secrets p/typescript"
  languages:
    description: >-
      Comma-separated languages present in the repository, from the
      detect-language action. Each one adds its Semgrep ruleset on top of
      `rulesets`. A repo with no Python gets exactly the rulesets it did
      before.
    required: false
    default: ""
  semgrep-json-output:
    description: >-
      Path to write Semgrep JSON results (for downstream findings parsing).
      Leave empty to skip JSON output.
    required: false
    default: ""
  gitleaks-json-output:
    description: >-
      Path to write Gitleaks JSON results (for downstream findings parsing).
      Leave empty to skip Gitleaks.
    required: false
    default: ""

outputs:
  semgrep-json-path:
    description: Path where Semgrep JSON was written (empty if skipped).
    value: ${{ steps.semgrep.outputs.json-path }}
  gitleaks-json-path:
    description: Path where Gitleaks JSON was written (empty if skipped).
    value: ${{ steps.gitleaks.outputs.json-path }}

runs:
  using: composite
  steps:
    # A missing scanner is an error, never a skip: a green job with no scan
    # reads the same as a clean scan.
    - name: Install Semgrep
      shell: bash
      env:
        SEMGREP_VERSION: "1.183.0"
      run: |
        set -euo pipefail
        if command -v semgrep &>/dev/null; then
          echo "semgrep already on the runner: $(semgrep --version)"
          exit 0
        fi
        pipx install "semgrep==${SEMGREP_VERSION}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run Semgrep
      id: semgrep
      shell: bash
      env:
        JSON_OUT: ${{ inputs.semgrep-json-output }}
        LANGUAGES: ${{ inputs.languages }}
      run: |
        semgrep --version
        CONFIGS=""
        for ruleset in ${{ inputs.rulesets }}; do
          CONFIGS="$CONFIGS --config $ruleset"
        done

        # Language rulesets are additive. Semgrep skips rules whose language
        # is absent from the scanned tree, so an unused one costs a little
        # rule-loading time and changes no result.
        case ",$LANGUAGES," in
          *,python,*) CONFIGS="$CONFIGS --config p/python" ;;
        esac

        JSON_ARGS=""
        if [ -n "$JSON_OUT" ]; then
          mkdir -p "$(dirname "$JSON_OUT")"
          JSON_ARGS="--json --output $JSON_OUT"
          echo "json-path=$JSON_OUT" >> "$GITHUB_OUTPUT"
        fi

        # Run with text output for console + optionally JSON to file
        if [ -n "$JSON_OUT" ]; then
          semgrep $CONFIGS --metrics off $JSON_ARGS || true
          semgrep --error $CONFIGS --metrics off
        else
          semgrep --error $CONFIGS --metrics off
        fi

    - name: Run Gitleaks
      id: gitleaks
      shell: bash
      env:
        JSON_OUT: ${{ inputs.gitleaks-json-output }}
      run: |
        if ! command -v gitleaks &>/dev/null; then
          echo "::notice::gitleaks not installed — skipping secret detection"
          exit 0
        fi
        gitleaks version

        REPORT_ARGS=""
        if [ -n "$JSON_OUT" ]; then
          mkdir -p "$(dirname "$JSON_OUT")"
          REPORT_ARGS="--report-format json --report-path $JSON_OUT"
          echo "json-path=$JSON_OUT" >> "$GITHUB_OUTPUT"
        fi

        gitleaks detect --source . --no-banner $REPORT_ARGS
