# No Bun lockfile, so the action installs nothing before Trunk runs.
version: 0.1
cli:
  version: 1.25.0
lint:
  definitions:
    - name: fixture-lint
      files: [ALL]
      suggest_if: never
      commands:
        - name: lint
          output: pass_fail
          target: .
          run: ${workspace}/scripts/fixture-lint.sh ${workspace}
          success_codes: [0, 1]
          disable_upstream: true
          cache_results: false
  enabled:
    - fixture-lint
